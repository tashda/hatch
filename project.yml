# Generates Hatch.xcodeproj (run `xcodegen generate`). The project is committed too, so opening it needs no tools.
name: Hatch
options:
  bundleIdPrefix: app.hatch
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  hatch:
    path: .
targets:
  Hatch:
    type: application
    platform: macOS
    sources:
      - path: App/Sources/HatchApp
      - path: App/Resources
    dependencies:
      - package: hatch
        product: HatchCore
      - package: hatch
        product: HatchGit
      - package: hatch
        product: HatchSync
      - package: hatch
        product: HatchAgent
      - package: hatch
        product: HatchAPI
      - package: hatch
        product: HatchComponentKit
      - package: hatch
        product: HatchImport
    postCompileScripts:
      - name: Build the hatch command
        basedOnDependencyAnalysis: false
        script: |
          # Builds the hatch command line tool and puts it in Hatch.app, signed like the app, so agents and the
          # Install in PATH button always use the hatch that matches this app.
          set -e
          CONFIG=$( [ "$CONFIGURATION" = "Release" ] && echo release || echo debug )
          cd "$SRCROOT"
          env -u SDKROOT -u TOOLCHAINS xcrun --sdk macosx swift build -c "$CONFIG" --product hatch
          DEST="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          mkdir -p "$DEST"
          cp -f ".build/$CONFIG/hatch" "$DEST/hatch"
          if [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ]; then
            codesign --force --options runtime --timestamp=none --sign "$EXPANDED_CODE_SIGN_IDENTITY" "$DEST/hatch"
          fi
      - name: Build the Stage app
        basedOnDependencyAnalysis: false
        script: |
          # Builds Stage.app and Components Designer.app (the same Stage program with the toast round, each with its own name
          # and icon in the Dock, decision AI3) and puts both in Hatch.app, so one download holds everything. Only a changed
          # Stage is copied again; build-stage.sh signs each bundle.
          set -e
          CONFIG=$( [ "$CONFIGURATION" = "Release" ] && echo release || echo debug )
          BUILT="$DERIVED_FILE_DIR/stage-app"
          SIGN=""
          [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ] && SIGN="--sign $EXPANDED_CODE_SIGN_IDENTITY"
          "$SRCROOT/tools/build-stage.sh" --dest "$BUILT" --config "$CONFIG" $SIGN
          DEST="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          mkdir -p "$DEST"
          if ! cmp -s "$BUILT/.stage.last" "$DERIVED_FILE_DIR/stage.copied" 2>/dev/null || [ ! -d "$DEST/Stage.app" ] || [ ! -d "$DEST/Components Designer.app" ]; then
            rm -rf "$DEST/Stage.app" "$DEST/Components Designer.app"
            cp -R "$BUILT/Stage.app" "$DEST/Stage.app"
            cp -R "$BUILT/Components Designer.app" "$DEST/Components Designer.app"
            cp -f "$BUILT/.stage.last" "$DERIVED_FILE_DIR/stage.copied"
          fi
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Hatch
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_NAME: Hatch
        PRODUCT_BUNDLE_IDENTIFIER: app.hatch.Hatch
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Hatch starts git, claude and xcodebuild, so it cannot run in the App Sandbox.
        ENABLE_APP_SANDBOX: NO
        # The build script below runs swift build in the package folder.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        # A real team, so every build has the same signature and the Keychain trusts it (ad-hoc builds prompt on each launch).
        DEVELOPMENT_TEAM: JQU2HR44D8
        GENERATE_INFOPLIST_FILE: NO
schemes:
  Hatch:
    build:
      targets:
        Hatch: all
    run:
      config: Debug
